<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HoloFrame icon: a bright viewport on a wide dim canvas">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#233062"/>
      <stop offset="0.55" stop-color="#111936"/>
      <stop offset="1" stop-color="#070a15"/>
    </linearGradient>
    <linearGradient id="a-plate" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2a3a68"/>
      <stop offset="0.5" stop-color="#3a4f88"/>
      <stop offset="1" stop-color="#2a3a68"/>
    </linearGradient>
    <linearGradient id="a-view" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#9dfbff"/>
      <stop offset="1" stop-color="#28a8ee"/>
    </linearGradient>
    <filter id="a-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="a-plateClip">
      <rect x="152" y="418" width="720" height="202" rx="22"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#a-bg)"/>

  <!-- the 32:9 canvas, dim: far more space than you can see at once -->
  <rect x="152" y="418" width="720" height="202" rx="22" fill="url(#a-plate)" opacity="0.55"/>
  <g clip-path="url(#a-plateClip)" opacity="0.4">
    <rect x="178" y="446" width="150" height="66" rx="9" fill="#8fa6dc" opacity="0.5"/>
    <rect x="178" y="528" width="96" height="62" rx="9" fill="#8fa6dc" opacity="0.32"/>
    <rect x="292" y="528" width="128" height="62" rx="9" fill="#8fa6dc" opacity="0.24"/>
    <rect x="700" y="446" width="150" height="144" rx="9" fill="#8fa6dc" opacity="0.3"/>
  </g>
  <rect x="152" y="418" width="720" height="202" rx="22" fill="none" stroke="#6f86c4" stroke-width="3" opacity="0.5"/>

  <!-- the viewport: exactly a quarter of the canvas wide, half its height -->
  <g filter="url(#a-glow)">
    <rect x="470" y="438" width="200" height="112" rx="14" fill="url(#a-view)" opacity="0.16"/>
    <rect x="470" y="438" width="200" height="112" rx="14" fill="none" stroke="url(#a-view)" stroke-width="11"/>
  </g>
  <rect x="470" y="438" width="200" height="112" rx="14" fill="none" stroke="#eafdff" stroke-width="3" opacity="0.9"/>

  <!-- it moves -->
  <g stroke="#7fd7ff" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M 404 494 l -34 0"/>
    <path d="M 736 494 l 34 0"/>
  </g>
  <g stroke="#7fd7ff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
    <path d="M 350 470 l -26 24 l 26 24"/>
    <path d="M 790 470 l 26 24 l -26 24"/>
  </g>
</svg>
