<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HoloFrame icon, simplified for small sizes">
  <!--
    For 16 and 32 px. Everything that turns to mush at that scale is gone: no temples, no
    window shapes, no outer strip, no blur. Thicker frames, taller lit area, higher
    contrast — the silhouette has to carry it alone.
  -->
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#333764"/>
      <stop offset="1" stop-color="#0a0b14"/>
    </linearGradient>
    <linearGradient id="s-strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19f0c8"/>
      <stop offset="0.5" stop-color="#3aabff"/>
      <stop offset="1" stop-color="#9a74ff"/>
    </linearGradient>
    <clipPath id="s-lenses">
      <path d="M 196 372 h 268 a 30 30 0 0 1 30 30 v 148 a 72 72 0 0 1 -72 72 h -184 a 72 72 0 0 1 -72 -72 v -148 a 30 30 0 0 1 30 -30 z"/>
      <path d="M 560 372 h 268 a 30 30 0 0 1 30 30 v 148 a 72 72 0 0 1 -72 72 h -184 a 72 72 0 0 1 -72 -72 v -148 a 30 30 0 0 1 30 -30 z"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#s-bg)"/>

  <g clip-path="url(#s-lenses)">
    <rect x="196" y="372" width="662" height="250" fill="url(#s-strip)"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linejoin="round">
    <path d="M 196 372 h 268 a 30 30 0 0 1 30 30 v 148 a 72 72 0 0 1 -72 72 h -184 a 72 72 0 0 1 -72 -72 v -148 a 30 30 0 0 1 30 -30 z"/>
    <path d="M 560 372 h 268 a 30 30 0 0 1 30 30 v 148 a 72 72 0 0 1 -72 72 h -184 a 72 72 0 0 1 -72 -72 v -148 a 30 30 0 0 1 30 -30 z"/>
  </g>
  <path d="M 494 410 q 18 -24 36 0" fill="none" stroke="#ffffff" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
