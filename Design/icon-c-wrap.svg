<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HoloFrame icon: a curved canvas wrapping around the viewer, with the visible slice lit">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3a2668"/>
      <stop offset="0.5" stop-color="#1a1440"/>
      <stop offset="1" stop-color="#0a0818"/>
    </linearGradient>
    <linearGradient id="c-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f6fae" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#8b9ae0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5f6fae" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="c-lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54e8ff"/>
      <stop offset="1" stop-color="#7b9bff"/>
    </linearGradient>
    <filter id="c-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#c-bg)"/>

  <!-- the canvas curves around you: far wider than the glasses can show -->
  <path d="M 230 597 A 300 300 0 0 1 794 597" fill="none" stroke="url(#c-band)"
        stroke-width="54" stroke-linecap="round"/>
  <path d="M 230 597 A 300 300 0 0 1 794 597" fill="none" stroke="#aab6ee"
        stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- the slice you are actually looking at -->
  <g filter="url(#c-glow)">
    <path d="M 385 428 A 300 300 0 0 1 639 428" fill="none" stroke="url(#c-lit)"
          stroke-width="54" stroke-linecap="round"/>
  </g>

  <!-- field of view, from you to that slice -->
  <g stroke="#54e8ff" stroke-width="9" stroke-linecap="round" opacity="0.45">
    <path d="M 512 700 L 391 447"/>
    <path d="M 512 700 L 633 447"/>
  </g>

  <!-- you -->
  <circle cx="512" cy="700" r="34" fill="#0a0818"/>
  <circle cx="512" cy="700" r="34" fill="none" stroke="#54e8ff" stroke-width="11"/>
  <circle cx="512" cy="700" r="11" fill="#9df3ff"/>

  <!-- it pans -->
  <g stroke="#8b9ae0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
     fill="none" opacity="0.55">
    <path d="M 250 700 l -30 -28 l 30 -28"/>
    <path d="M 774 700 l 30 -28 l -30 -28"/>
  </g>
</svg>
